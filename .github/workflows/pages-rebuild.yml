# Pushes made by the Claude GitHub App don't kick off the GitHub Pages build on
# their own, so request one explicitly on every push to main.
name: Rebuild GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Request Pages build
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
